<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document Certificate</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Document Certificate</h2>
    <form id="certForm">
        <label>Certificate ID:
            <input type="text" id="certId" required>
        </label>
        <label>Certificate Hash:
            <input type="text" id="certHash" required>
        </label>
        <button type="submit">Store Certificate</button>
    </form>
    <p id="certMessage"></p>
    <script src="script.js"></script>
</body>
</html>
