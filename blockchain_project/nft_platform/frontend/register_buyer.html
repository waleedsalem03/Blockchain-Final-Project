<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register as Buyer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Register as Buyer</h2>
    <form id="buyerForm">
        <label>Username:
            <input type="text" id="buyerUsername" required>
        </label>
        <label>Password:
            <input type="password" id="buyerPassword" required>
        </label>
        <button type="submit">Register</button>
    </form>
    <p id="buyerMessage"></p>
    <script src="script.js"></script>
</body>
</html>
