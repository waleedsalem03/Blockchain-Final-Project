<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register as Merchant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Register as Merchant</h2>
    <form id="merchantForm">
        <label>Username:
            <input type="text" id="merchantUsername" required>
        </label>
        <label>Password:
            <input type="password" id="merchantPassword" required>
        </label>
        <button type="submit">Register</button>
    </form>
    <p id="merchantMessage"></p>
    <script src="script.js"></script>
</body>
</html>
